<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170">
  <g transform="translate(0, 0)">
    <!-- ALL -->
    <text x="28" y="44" fill="#132B4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="1">ALL</text>
    
    <!-- India -->
    <text x="5" y="116" fill="#132B4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="-1.5">India</text>
    
    <!-- Gold Dot over lowercase 'i' -->
    <circle cx="119" cy="70" r="9" fill="#C59B53" />
    
    <!-- Vertical Gold Divider -->
    <line x1="225" y1="8" x2="225" y2="122" stroke="#C59B53" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- CME -->
    <text x="250" y="112" fill="#132B4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-2">CME</text>
    
    <!-- Bottom powered by covelis section -->
    <line x1="28" y1="148" x2="135" y2="148" stroke="#C59B53" stroke-width="2.5" stroke-linecap="round" />
    <text x="150" y="153" fill="#132B4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="400">powered by <tspan font-weight="800">covelis</tspan></text>
    <line x1="390" y1="148" x2="525" y2="148" stroke="#C59B53" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
