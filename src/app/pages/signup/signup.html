<div class="signup-page">

  <!-- Home button -->
  <a routerLink="/" class="home-btn">Home</a>

  <!-- Registration Popup -->
  <div class="signup-overlay">

    <div class="signup-card">

      <!-- Fixed Header -->
      <div class="signup-header">

        <div class="signup-icon">📝</div>

        <div>
          <h1>New Doctor Registration</h1>
          <p>Create your account to access CME programs and courses.</p>
        </div>

      </div>

      <!-- Scrollable Content -->
      <div class="signup-content">

        <form (ngSubmit)="submitRegistration()">

          <div class="signup-grid">

            <!-- Designation -->
            <div class="form-group">
              <label>Designation *</label>

              <select
                [(ngModel)]="regDesignation"
                name="regDesignation"
                required>
                <option value="Dr.">Dr.</option>
                <option value="Prof. Dr.">Prof. Dr.</option>
                <option value="Assoc. Prof. Dr.">Assoc. Prof. Dr.</option>
              </select>
            </div>

            <!-- Mobile -->
            <div class="form-group">
              <label>Mobile Number *</label>

             <input
  type="text"
  [(ngModel)]="regMobileNumber"
  name="regMobileNumber"
  placeholder="Mobile Number"
  maxlength="15"
  required>
            </div>

            <!-- First Name -->
            <div class="form-group">
              <label>First Name *</label>

              <input
                type="text"
                [(ngModel)]="regFirstName"
                name="regFirstName"
                placeholder="First Name"
                required>
            </div>

            <!-- Middle Name -->
            <div class="form-group">
              <label>Middle Name</label>

              <input
                type="text"
                [(ngModel)]="regMiddleName"
                name="regMiddleName"
                placeholder="Middle Name">
            </div>

            <!-- Last Name -->
            <div class="form-group">
              <label>Last Name *</label>

              <input
                type="text"
                [(ngModel)]="regLastName"
                name="regLastName"
                placeholder="Last Name"
                required>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label>Email Address *</label>

              <input
                type="email"
                [(ngModel)]="regEmail"
                name="regEmail"
                placeholder="email@hospital.org"
                required>
            </div>

            <!-- Gender -->
            <div class="form-group">
              <label>Gender</label>

              <select
                [(ngModel)]="regGender"
                name="regGender">

                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">
                  Prefer not to say
                </option>

              </select>
            </div>

            <!-- DOB -->
            <div class="form-group">
              <label>Date of Birth</label>

              <input
                type="date"
                [(ngModel)]="regDob"
                name="regDob">
            </div>

            <!-- Specialty -->
            <div class="form-group">
              <label>Specialty Category *</label>

              <select
                [(ngModel)]="regSpecialty"
                name="regSpecialty"
                required>

                <option value="Cardiology">Cardiology</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Neurology">Neurology</option>
                <option value="Surgery">Surgery</option>
                <option value="General Medicine">
                  General Medicine
                </option>
                <option value="Other">Other</option>

              </select>
            </div>

            <!-- Other Specialty -->
            <div
              class="form-group"
              *ngIf="regSpecialty === 'Other'">

              <label>Specify Specialty *</label>

              <input
                type="text"
                [(ngModel)]="regSpecialtyOther"
                name="regSpecialtyOther"
                placeholder="Specify specialty"
                required>

            </div>

            <!-- Qualification -->
            <div class="form-group">
              <label>Qualification *</label>

              <select
                [(ngModel)]="regQualification"
                name="regQualification"
                required>

                <option value="MBBS">MBBS</option>
                <option value="MD">MD</option>
                <option value="MS">MS</option>
                <option value="DM">DM</option>
                <option value="MCh">MCh</option>
                <option value="DNB">DNB</option>
                <option value="PhD">PhD</option>
                <option value="Other">Other</option>

              </select>
            </div>

            <!-- MMC -->
            <div class="form-group">
              <label>Medical Registration Number *</label>

              <input
                type="text"
                [(ngModel)]="regMmcNo"
                name="regMmcNo"
                placeholder="Medical Registration Number"
                required>
            </div>

            <!-- Hospital -->
            <div class="form-group">
              <label>Hospital / Institution *</label>

              <input
                type="text"
                [(ngModel)]="regHospital"
                name="regHospital"
                placeholder="Hospital Name"
                required>
            </div>

            <!-- Organization -->
            <div class="form-group">
              <label>Organization</label>

              <input
                type="text"
                [(ngModel)]="regOrganization"
                name="regOrganization"
                placeholder="Organization">
            </div>

            <!-- Department -->
            <div class="form-group">
              <label>Department</label>

              <input
                type="text"
                [(ngModel)]="regDepartment"
                name="regDepartment"
                placeholder="e.g. Cardiology Dept">
            </div>

            <!-- Experience -->
            <div class="form-group">
              <label>Years of Experience</label>

              <input
                type="number"
                [(ngModel)]="regExperience"
                name="regExperience"
                placeholder="e.g. 5"
                min="0">
            </div>

            <!-- Language -->
            <div class="form-group">
              <label>Preferred Language *</label>

              <select
                [(ngModel)]="regLanguage"
                name="regLanguage"
                required>

                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Marathi">Marathi</option>

              </select>
            </div>

            <!-- City -->
            <div class="form-group">
              <label>City *</label>

              <input
                type="text"
                [(ngModel)]="regCity"
                name="regCity"
                placeholder="City"
                required>
            </div>

            <!-- Clinic Address -->
            <div class="form-group full-width">
              <label>Clinic Address</label>

              <textarea
                [(ngModel)]="regClinicAddress"
                name="regClinicAddress"
                placeholder="Clinic / Office Address"
                rows="3">
              </textarea>
            </div>

            <!-- CME Interests -->
            <div class="form-group full-width interests-section">

              <label class="section-label">
                Select CME Interests
              </label>

              <div class="interest-options">

                <label>
                  <input
                    type="checkbox"
                    [(ngModel)]="regInterests['Cardiology']"
                    name="interestCardiology">

                  Cardiology
                </label>

                <label>
                  <input
                    type="checkbox"
                    [(ngModel)]="regInterests['Pediatrics']"
                    name="interestPediatrics">

                  Pediatrics
                </label>

                <label>
                  <input
                    type="checkbox"
                    [(ngModel)]="regInterests['Neurology']"
                    name="interestNeurology">

                  Neurology
                </label>

                <label>
                  <input
                    type="checkbox"
                    [(ngModel)]="regInterests['Surgery']"
                    name="interestSurgery">

                  Surgery
                </label>

                <label>
                  <input
                    type="checkbox"
                    [(ngModel)]="regInterests['General Medicine']"
                    name="interestGenMed">

                  General Medicine
                </label>

              </div>

            </div>

            <!-- Consents -->
            <div class="consents full-width">

              <label>
                <input
                  type="checkbox"
                  [(ngModel)]="regEmailConsent"
                  name="regEmailConsent"
                  required>

                <span>
                  I consent to receive emails regarding CME updates
                  and courses *
                </span>
              </label>

              <label>
                <input
                  type="checkbox"
                  [(ngModel)]="regWhatsappConsent"
                  name="regWhatsappConsent"
                  required>

                <span>
                  I consent to receive WhatsApp notifications for
                  certificate validation and event alerts *
                </span>
              </label>

              <label>
                <input
                  type="checkbox"
                  [(ngModel)]="regTermsConsent"
                  name="regTermsConsent"
                  required>

                <span>
                  I agree to the Terms of Service &amp; Privacy Policy *
                </span>
              </label>

            </div>

          </div>

          <!-- Footer -->
          <div class="signup-footer">

            <a
              routerLink="/login"
              class="back-login">
              Already have an account? Log In
            </a>

            <div class="action-buttons">

              <a
                routerLink="/"
                class="btn-cancel">
                Cancel
              </a>

              <button
                type="submit"
                class="btn-submit">

                Register &amp; Proceed to OTP Login →

              </button>

            </div>

          </div>

        </form>

      </div>

    </div>

  </div>

  <!-- Success message -->
  <div
    class="success-toast"
    *ngIf="regSuccessMsg">

    🎉 {{ regSuccessMsg }}

  </div>

</div>
